packages:
  - apps/*
  - packages/*
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite: 'catalog:'
peerDependencyRules:
  allowedVersions:
    vite: '*'
allowBuilds:
  '@modelcontextprotocol/ext-apps': false
  '@scarf/scarf': false
  core-js: false
  protobufjs: false
  electron: true
  electron-winstaller: false
  esbuild: true
minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.105.0'
  - '@tanstack/react-query@5.105.0'
  - expo@58.0.25
patchedDependencies:
  '@tanstack/router-generator@1.167.46': patches/@tanstack__router-generator@1.167.46.patch
