name: Desktop builds

on:
  pull_request:
  push:
    branches: [main]
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm --filter @openfactory/desktop test
      - run: pnpm build:site
      - run: pnpm verify:site
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node --input-type=module -e "import fs from 'node:fs'; const {version} = JSON.parse(fs.readFileSync('apps/desktop/package.json')); if (process.env.GITHUB_REF_NAME !== 'desktop-v' + version) throw new Error('Release tag must match the desktop package version');"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            command: build
          - os: macos-15
            platform: mac
            command: build:mac
          - os: windows-2025
            platform: windows
            command: build:windows
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify local runtime transport
        run: pnpm exec vp test packages/runtime/src/ipc.test.ts
      - name: Build installer
        run: pnpm --filter @openfactory/desktop ${{ matrix.command }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify packaged host and runtime
        working-directory: apps/desktop
        run: node scripts/verify-package.mjs
      - name: Verify the AppImage payload
        if: matrix.platform == 'linux'
        run: node scripts/verify-appimage.mjs
      - name: Verify both Mac archives
        if: matrix.platform == 'mac'
        run: pnpm --filter @openfactory/desktop test:mac
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/dist/OpenFactory-*.deb
            apps/desktop/dist/OpenFactory-*.dmg
            apps/desktop/dist/OpenFactory-*.AppImage
            apps/desktop/dist/OpenFactory-*.zip
            apps/desktop/dist/OpenFactory-*.exe
            apps/desktop/dist/OpenFactory-*-build-manifest.json

  cli:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm runtime:build
      - name: Package self-contained CLI archives
        run: node scripts/package-cli.mjs linux-x64 linux-arm64 darwin-x64 darwin-arm64
      - name: Verify the packaged CLI against its real runtime
        run: node scripts/verify-cli.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-cli
          if-no-files-found: error
          retention-days: 14
          path: apps/desktop/dist/openfactory-cli-*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [build, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: installers
      - name: Checksum all release assets
        run: node scripts/release-checksums.mjs installers
      - name: Publish all installers together
        env:
          GH_TOKEN: ${{ secrets.OPENFACTORY_RELEASES_TOKEN || github.token }}
          RELEASE_REPOSITORY: ${{ vars.OPENFACTORY_RELEASES_REPOSITORY || 'the-agentic-company/openfactory-releases' }}
        run: |
          if [ "$RELEASE_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
            tag_options=(--verify-tag)
          else
            tag_options=(--target main)
          fi
          gh release create "$GITHUB_REF_NAME" installers/* \
            --repo "$RELEASE_REPOSITORY" \
            "${tag_options[@]}" \
            --title "OpenFactory ${GITHUB_REF_NAME#desktop-v}" \
            --notes "Desktop preview for Apple Silicon and Intel Macs, Linux, and Windows. Mac and Windows builds are unsigned. Install and authenticate Codex CLI or Claude Code CLI on each execution computer."
