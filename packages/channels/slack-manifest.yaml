# Create the app at https://api.slack.com/apps → Create New App → From a manifest.
# Then: Basic Information → App-Level Tokens → generate one with connections:write (SLACK_APP_TOKEN),
# and Install App → copy the Bot User OAuth Token (SLACK_BOT_TOKEN).
display_information:
  name: OpenFactory
  description: Talk to your OpenFactory agents from Slack.
features:
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: openfactory
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - im:read
      - im:write
      - chat:write
      - reactions:write
      - users:read
      - assistant:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
